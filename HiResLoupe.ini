; HiResLoupe settings (keep this file in the same folder as the exe; write plain ASCII/ANSI text)
; Key format: join Ctrl / Alt / Shift / Win with +, then the key name at the end.
;   Key names: A-Z, 0-9, F1-F24, Multiply (numpad *), Oem1 (the : key on a Japanese keyboard), Esc, Space, Enter, Tab, or hex such as 0x6A
;   toggle2 is a second start key. Leave it empty to not use it.
;   You can also change toggle / exit / latch / preset1-3 from the tray menu ("Change shortcuts"); the choice is saved here.

[hotkey]
toggle=Win+Alt+Z
toggle2=
; Key that hides the loupe while it is shown (Ctrl+right-click also hides it)
exit=Esc
; Key that pins the loupe in place (press again to unpin). The view keeps following the mouse
latch=Ctrl+Space
; Keys that change the loupe shape: 1 = square, 2 = wide 16:9, 3 = tall 16:9 (not while pinned)
preset1=1
preset2=2
preset3=3

[zoom]
; Units are %. Wheel down adds "step", wheel up subtracts it
default=200
step=25
max=400

[lens]
; Initial side length of the loupe in pixels (square). Ctrl+wheel resizes it in 10% steps
size=1024
; 1 = when the mouse moves to another monitor, the loupe follows. 0 = stay on the monitor it started on
follow_monitor=1
; Loupe frame. border: 1 = show, 0 = hide. border_width = thickness in pixels (drawn over the inner edge of the loupe)
border=1
border_width=4
; 1 = while the loupe is pinned, draw the pointer inside the loupe where the mouse is (so you can tell where it is). 0 = don't
pinned_cursor=1

[debug]
; 1 = every 30 frames, write per-stage timings and fps to HiResLoupe.log (the log is in Japanese)
log_timing=0
; Margin (source px, 0-32, rounded down to a multiple of 4) so super resolution can see the neighboring tile at tile edges. 0 = none. Smaller is lighter, but check for quality seams between tiles
pad=8
; How many screen px beyond the visible loupe area to pre-draw (0-1024). Lower it to test whether fast movement still keeps up (watch the "out of range" count in the log)
ahead=30

[ui]
; Menu language: en, ja, zh (Simplified Chinese), ko. Empty = follow the Windows display language.
; You can also change it from the tray menu ("Language"); the choice is saved here.
language=

[text]
; Override individual tray menu / tooltip texts. Leave empty to use the selected language.
; Each key is named after the English menu item it changes. Save this file as UTF-8 or ANSI.
; Do not write notes after a value (the whole line is the text).
;   show_loupe          = menu item shown while the loupe is hidden
;   hide_loupe          = menu item shown while the loupe is visible
;   open_settings_file, reload_settings, start_with_windows, quit = the items of the same name
;   language            = name of the "Language" item
;   pinned_cursor       = the "Show pointer in pinned loupe" item
;   tray_tooltip        = text shown when you hover over the tray icon
show_loupe=
hide_loupe=
open_settings_file=
reload_settings=
start_with_windows=
language=
quit=
pinned_cursor=
tray_tooltip=
